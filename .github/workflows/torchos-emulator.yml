name: TorchOS ARM QEMU Boot & FDT QA

on:
  push:
    branches:
      - feat/torchos-native-shell-20261114
      - 'feature/torchos-*'
    paths:
      - '.github/workflows/torchos-emulator.yml'
      - 'torchos-emulator/**'
  pull_request:
    branches:
      - feat/torchos-native-shell-20261114
    paths:
      - '.github/workflows/torchos-emulator.yml'
      - 'torchos-emulator/**'

# GitHub-hosted only: no personal self-hosted runner or BlackBerry access.
permissions:
  contents: read

jobs:
  arm-boot:
    name: Bare-metal QEMU boot and UART smoke tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Read-only checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install generic ARM compiler and emulator on hosted runner
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi binutils-arm-none-eabi qemu-system-arm
          arm-none-eabi-gcc --version | head -1
          qemu-system-arm --version | head -1

      - name: Compile standalone research ARM ELF
        shell: bash
        run: |
          set -euo pipefail
          make -C torchos-emulator all
          make -C torchos-emulator inspect
          sha256sum torchos-emulator/build/torchos.elf

      - name: Actually cold-boot QEMU and exercise UART commands
        shell: bash
        run: |
          set -euo pipefail
          make -C torchos-emulator test
          make -C torchos-emulator inspect-fdt

      - name: Report scope without artifact upload
        if: success()
        shell: bash
        run: |
          {
            echo '## TorchOS CP006.2 — QEMU virtual ARM and FDT'
            echo 'Bare-metal ARM ELF compiled and cold-booted under QEMU virt.'
            echo 'Interactive UART, local-command and malformed-FDT tests passed.'
            echo 'QEMU virt device-tree UART/RAM inventory validated on the host; no physical hardware detected.'
            echo 'This is **not** a retail BlackBerry Torch 9810 image or device proof.'
            echo 'No flash, driver, firmware, handset, secret or private runner was used.'
          } >> "$GITHUB_STEP_SUMMARY"

# Never add self-hosted runners, physical deployment or a flash target.
