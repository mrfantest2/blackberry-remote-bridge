name: TorchOS Host QA

on:
  push:
    branches:
      - main
      - feat/torchos-native-shell-20261114
    paths:
      - '.github/workflows/torchos-ci.yml'
      - 'torchos-native/**'
      - 'scripts/test-all.sh'
      - 'tests/**'
      - 'blackberry-s25-native/tests/**'
  pull_request:
    branches:
      - main
      - feat/torchos-native-shell-20261114
    paths:
      - '.github/workflows/torchos-ci.yml'
      - 'torchos-native/**'
      - 'scripts/test-all.sh'
      - 'tests/**'
      - 'blackberry-s25-native/tests/**'
  workflow_dispatch:

# Only GitHub-hosted runners. Never attach a personal Steam Deck to
# public pull-request workflows, and never deploy to the BlackBerry.
permissions:
  contents: read

concurrency:
  group: torchos-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    name: Offline QA (no device access)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (read-only token)
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'

      - name: Set up Java 8 for Java ME host doubles
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '8'

      - name: Check runtime availability
        shell: bash
        run: |
          set -euo pipefail
          python --version
          java -version
          javac -version
          node --version
          bash -n torchos-native/build.sh torchos-native/test.sh scripts/test-all.sh

      - name: All offline TorchOS QA suites
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/test-all.sh

      - name: Record QA scope without consuming artifact quota
        if: success()
        shell: bash
        run: |
          {
            echo '## TorchOS hosted QA'
            echo 'All host-test jobs passed.'
            echo 'The authentic proprietary BlackBerry JDE COD build is **not** part of GitHub-hosted CI.'
            echo 'No hardware access, firmware changes, deployment or Codex process occurred.'
          } >> "$GITHUB_STEP_SUMMARY"

# This workflow does not compile a native BlackBerry COD: the authentic
# proprietary JDE 7.0/WTK toolchain is present only on the authorized
# Steam Deck and must not be embedded into a public repository or runner.
# GitHub Actions is CI, not an autonomous source-code-writing AI agent.
